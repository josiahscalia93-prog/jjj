<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SnapBurst Recorder</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #FAFAFA; padding: 24px; color: #0F0F0F; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    button { border: 2px solid #0F0F0F; background: #FDE047; padding: 10px 16px; font-weight: 700; border-radius: 10px; box-shadow: 4px 4px 0 #0F0F0F; cursor: pointer; }
    button.stop { background: #FB923C; }
    #status { margin-top: 14px; font-size: 14px; }
    video { margin-top: 16px; max-width: 100%; border: 2px solid #0F0F0F; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>SnapBurst — Recording</h1>
  <button id="start">Start recording</button>
  <button id="stop" class="stop" style="display:none">Stop & upload</button>
  <div id="status"></div>
  <video id="prev" controls></video>
  <script src="recorder.js"></script>
</body>
</html>
