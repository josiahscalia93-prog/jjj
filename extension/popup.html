<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>SnapBurst</title>
</head>
<body>
  <header class="hdr">
    <div class="logo">
      <span class="dot"></span>
      <strong>SnapBurst</strong>
    </div>
    <button id="open-dashboard" class="ghost" title="Open dashboard">Dashboard</button>
  </header>

  <section id="auth-banner" class="banner hide">
    Connect your account to save & share captures.
    <button id="connect" class="primary">Connect</button>
  </section>

  <section class="grid">
    <button class="tile yellow" id="cap-visible">
      <div class="tile-icn">▸</div>
      <div class="tile-tt">Visible Area</div>
      <div class="tile-st">Quick screenshot</div>
    </button>
    <button class="tile pink" id="cap-full">
      <div class="tile-icn">▤</div>
      <div class="tile-tt">Full Page</div>
      <div class="tile-st">Scrolling capture</div>
    </button>
    <button class="tile mint" id="rec-screen">
      <div class="tile-icn">●</div>
      <div class="tile-tt">Record Screen</div>
      <div class="tile-st">Tab / window / desktop</div>
    </button>
    <button class="tile blue" id="rec-cam">
      <div class="tile-icn">◉</div>
      <div class="tile-tt">Webcam + Mic</div>
      <div class="tile-st">Talking head</div>
    </button>
  </section>

  <section class="recent">
    <h4>Recent</h4>
    <div id="recent-list" class="recent-list">
      <div class="empty">Nothing yet — make your first capture!</div>
    </div>
  </section>

  <footer class="ftr">
    <a id="open-app" href="#">Open Web App</a>
    <span id="status"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
